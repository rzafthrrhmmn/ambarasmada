<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline - Jaya Jaya Jaya</title>
    <meta name="theme-color" content="#263D26">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif; }
        body { background: #263D26; color: #f0ead8; display: flex; align-items: center; justify-content: center; }
        .container { text-align: center; padding: 2rem; }
        .logo {
            display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;
            width: 64px; height: 64px; border-radius: 16px;
            background: linear-gradient(135deg, #A7B92A, #EDD330);
            font-weight: 800; color: #263D26; font-size: 1.5rem;
            border: 3px solid #EDD330; box-shadow: 0 0 20px rgba(237, 211, 48, 0.4);
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #EDD330;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
        }
        p { opacity: 0.8; color: #d4dc9a; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">P</div>
        <h1>Anda Sedang Offline</h1>
        <p>Halaman ini tidak tersedia karena koneksi internet Anda terputus.</p>
    </div>
</body>
</html>
